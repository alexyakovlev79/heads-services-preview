name: Heads services preview QA

on:
  push:
    branches: [main, work/heads-s02-strategy-copy, work/heads-s02-geo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out preview
        uses: actions/checkout@v4

      - name: Check static resources and JavaScript
        run: node scripts/check-preview.mjs

      - name: Verify GEO content, cases and structured data
        run: node scripts/check-geo.mjs

      - name: Check strategy preview resources and isolation
        run: node scripts/check-strategy-preview.mjs

      - name: Install browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core

      - name: Test interactions in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/heads-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          node scripts/check-browser.mjs
          S02_CAPTURE_ORIGINAL=1 node scripts/check-strategy-browser.mjs

      - name: Capture optional browser screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/heads-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          BROWSER=""
          if command -v google-chrome >/dev/null 2>&1; then BROWSER=google-chrome; fi
          if [ -z "$BROWSER" ] && command -v chromium >/dev/null 2>&1; then BROWSER=chromium; fi
          if [ -z "$BROWSER" ]; then
            echo "No Chrome/Chromium binary on runner; static audit passed but browser screenshots unavailable."
            exit 0
          fi
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=3500 --window-size=1440,1200 \
            --screenshot=qa-artifacts/desktop.png http://127.0.0.1:8000/
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --virtual-time-budget=3500 --window-size=390,1000 \
            --screenshot=qa-artifacts/mobile.png http://127.0.0.1:8000/
          test -s qa-artifacts/desktop.png
          test -s qa-artifacts/mobile.png
          echo "Desktop and mobile browser screenshots saved in the workflow artifact."

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heads-services-preview-qa
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7
