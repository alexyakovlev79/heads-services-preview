name: Heads portfolio preview QA

on:
  push:
    branches: [main, work/heads-s03-portfolio-copy]
    paths:
      - 'formirovanie-portfelja-brendov/**'
      - 'docs/s03-portfolio/assets-manifest.json'
      - 'scripts/check-portfolio-*.mjs'
      - '.github/workflows/portfolio-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check S03 assets and form isolation
        run: node scripts/check-portfolio-preview.mjs
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Check four viewport widths and compare with the original
        env:
          S03_CAPTURE_ORIGINAL: '1'
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/; then break; fi
            sleep 1
          done
          node scripts/check-portfolio-browser.mjs
      - name: Upload full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heads-s03-screenshots
          path: qa-artifacts/portfolio/
          if-no-files-found: ignore
          retention-days: 30
