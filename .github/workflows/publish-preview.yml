name: Publish Heads services preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: heads-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html preview.js preview.css geo-enhancements.css dist/
          cp -a assets/. dist/assets/
          mkdir -p dist/strategija-i-pozicionirovanie
          cp -a strategija-i-pozicionirovanie/{index.html,preview.css,preview.js,assets} dist/strategija-i-pozicionirovanie/
          test -s dist/strategija-i-pozicionirovanie/index.html
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/geo-enhancements.css
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live customer-facing page
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${LIVE_URL}?sha=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 15); do
            if curl --fail --location --silent --show-error --max-time 20 "${url}" -o /tmp/heads-live.html               && grep -Fq 'Heads · Москва, Россия' /tmp/heads-live.html               && grep -Fq 'Давайте обсудим задачу?' /tmp/heads-live.html               && grep -Fq 'Наш бесценный опыт' /tmp/heads-live.html               && grep -Fq 'Опишите задачу, продуктовые категории' /tmp/heads-live.html; then
              ok=1
              break
            fi
            sleep 4
          done
          test "${ok}" -eq 1 || { echo "ERROR: new content is not visible at ${LIVE_URL}"; exit 1; }
          if grep -Fq 'Кейс не выдается за создание новой стратегии бренда' /tmp/heads-live.html; then
            echo "ERROR: internal editorial note leaked into the published page"
            exit 1
          fi
          curl --fail --location --silent --show-error --max-time 20 "${LIVE_URL}geo-enhancements.css" -o /tmp/heads-live.css
          test -s /tmp/heads-live.css
          echo "PASS: published GEO page and stylesheet verified: ${LIVE_URL}"
      - name: Verify live strategy preview
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${LIVE_URL}strategija-i-pozicionirovanie/"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "${url}?sha=${GITHUB_SHA}" -o /tmp/heads-strategy.html \
              && grep -Fq 'Стратегия и позиционирование' /tmp/heads-strategy.html \
              && grep -Fq 'data-preview-form="project"' /tmp/heads-strategy.html \
              && curl -fsSL --max-time 20 "${url}preview.css" -o /tmp/heads-strategy.css \
              && test -s /tmp/heads-strategy.css; then
              exit 0
            fi
            sleep 4
          done
          echo "ERROR: strategy preview is unavailable at ${url}"
          exit 1
