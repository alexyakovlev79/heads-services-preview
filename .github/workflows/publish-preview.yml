name: Publish Heads services preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: heads-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html preview.js preview.css geo-enhancements.css dist/
          cp -a assets/. dist/assets/
          mkdir -p dist/strategija-i-pozicionirovanie
          cp -a strategija-i-pozicionirovanie/{index.html,preview.css,preview.js,geo-s02.css,geo-s02.js,assets} dist/strategija-i-pozicionirovanie/
          test -s dist/strategija-i-pozicionirovanie/index.html
          mkdir -p dist/formirovanie-portfelja-brendov
          cp -a formirovanie-portfelja-brendov/{index.html,preview.css,preview.js,assets} dist/formirovanie-portfelja-brendov/
          test -s dist/formirovanie-portfelja-brendov/index.html
          mkdir -p dist/dizajn-upakovki
          cp -a dizajn-upakovki/{index.html,preview.css,preview.js,assets} dist/dizajn-upakovki/
          test -s dist/dizajn-upakovki/index.html
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/geo-enhancements.css
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live customer-facing page
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${LIVE_URL}?sha=${GITHUB_SHA}"
          ok=0
          for attempt in $(seq 1 15); do
            if curl --fail --location --silent --show-error --max-time 20 "${url}" -o /tmp/heads-live.html               && grep -Fq 'Heads · Москва, Россия' /tmp/heads-live.html               && grep -Fq 'Давайте обсудим задачу?' /tmp/heads-live.html               && grep -Fq 'Наш бесценный опыт' /tmp/heads-live.html               && grep -Fq 'Опишите задачу, продуктовые категории' /tmp/heads-live.html; then
              ok=1
              break
            fi
            sleep 4
          done
          test "${ok}" -eq 1 || { echo "ERROR: new content is not visible at ${LIVE_URL}"; exit 1; }
          if grep -Fq 'Кейс не выдается за создание новой стратегии бренда' /tmp/heads-live.html; then
            echo "ERROR: internal editorial note leaked into the published page"
            exit 1
          fi
          curl --fail --location --silent --show-error --max-time 20 "${LIVE_URL}geo-enhancements.css" -o /tmp/heads-live.css
          test -s /tmp/heads-live.css
          echo "PASS: published GEO page and stylesheet verified: ${LIVE_URL}"
      - name: Verify live strategy preview
        shell: bash
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          url="${LIVE_URL}strategija-i-pozicionirovanie/"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 20 "${url}?sha=${GITHUB_SHA}" -o /tmp/heads-strategy.html \
              && grep -Fq 'Стратегия и позиционирование' /tmp/heads-strategy.html \
              && grep -Fq 'data-preview-form="project"' /tmp/heads-strategy.html \
              && grep -Fq 'Когда стоит заняться позиционированием' /tmp/heads-strategy.html \
              && grep -Fq '7 вариантов позиционирования' /tmp/heads-strategy.html \
              && curl -fsSL --max-time 20 "${url}preview.css" -o /tmp/heads-strategy.css \
              && curl -fsSL --max-time 20 "${url}geo-s02.css" -o /tmp/heads-geo-s02.css \
              && curl -fsSL --max-time 20 "${url}geo-s02.js" -o /tmp/heads-geo-s02.js \
              && test -s /tmp/heads-strategy.css \
              && test -s /tmp/heads-geo-s02.css \
              && test -s /tmp/heads-geo-s02.js; then
              exit 0
            fi
            sleep 4
          done
          echo "ERROR: strategy preview is unavailable at ${url}"
          exit 1
      - name: Install portfolio browser test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Verify the published portfolio preview in Chrome
        env:
          S03_PREVIEW_BASE: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-portfolio-browser.mjs
      - name: Upload published portfolio screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heads-s03-published-screenshots
          path: qa-artifacts/portfolio/
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify the published packaging preview in Chrome
        env:
          S04_PREVIEW_BASE: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/check-packaging-browser.mjs
      - name: Upload published packaging screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heads-s04-published-screenshots
          path: qa-artifacts/packaging/
          if-no-files-found: ignore
          retention-days: 30
