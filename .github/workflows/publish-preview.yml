name: Publish Heads services preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: heads-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Prepare public website only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html preview.js preview.css geo-enhancements.css dist/
          cp -a assets/. dist/assets/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/geo-enhancements.css
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
