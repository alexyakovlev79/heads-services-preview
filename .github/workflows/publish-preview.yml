name: Publish Heads services preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: heads-preview-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
